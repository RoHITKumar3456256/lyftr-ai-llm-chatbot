services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - ENABLE_FAILURE_SIMULATION=true
    volumes:
      - sqlite_data:/data
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  sqlite_data:

